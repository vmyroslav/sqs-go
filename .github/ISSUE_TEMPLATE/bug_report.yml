name: "Bug Report"
description: "Something isn't working as expected."
labels: ["bug"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: "What happened?"
      description: "Describe the bug and what you expected to happen instead."
      placeholder: "When I do [...], [...] happens. I expected [...]."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "How to reproduce it"
      description: "A minimal code example or steps that reproduce the issue. Include any error output or panic trace."
    validations:
      required: true

  - type: input
    id: library-version
    attributes:
      label: "sqs-go version"
      placeholder: "v1.2.3 (from go.mod)"
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: "Go version"
      placeholder: "go1.24.5"
