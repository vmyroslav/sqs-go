name: "Feature Request"
description: "Suggest an idea or improvement."
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: "What would you like, and why?"
      description: "Describe the feature and the problem it solves or the use case it enables."
      placeholder: "I'd like to be able to [...] because [...]."
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context"
      description: "Alternatives you've considered, example code, links — anything that helps. Optional."
