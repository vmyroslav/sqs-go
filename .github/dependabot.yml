# Dependabot configuration.
# All Go module updates (root + examples) are grouped into a single PR,
# and all GitHub Actions updates into another.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /examples/json
      - /examples/observability
      - /examples/simple
    schedule:
      interval: monthly
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
